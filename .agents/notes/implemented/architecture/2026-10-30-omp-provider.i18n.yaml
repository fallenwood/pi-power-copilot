title:
  en: Add a native Oh My Pi provider adapter
  zh: 增加原生 Oh My Pi provider 适配器
status: implemented
related:
  - en: 2026-10-22-dual-runtime-provider.md
    zh: 2026-10-22-dual-runtime-provider.zh.md
  - en: ../feature/2026-10-17-custom-context-windows.md
    zh: ../feature/2026-10-17-custom-context-windows.zh.md
sections:
  Problem:
    en: OMP 18.14 has named provider registration, native OAuth callbacks, canonical thinking metadata, and SQLite discovery rather than Pi 1.x provider objects; compatibility imports do not make those contracts interchangeable. The Pi/Harness architecture remains valid for those runtimes.
    zh: OMP 18.14 使用按名称注册 provider、原生 OAuth 回调、规范化 thinking 元数据及 SQLite 发现，而非 Pi 1.x provider 对象；兼容导入不能使这些契约互换。Pi/Harness 架构对原有运行时保持有效。
  Decision:
    en: A separate omp manifest and entry share neutral catalog, OAuth, routing, and bounds code without importing the Pi provider factory. Host SDKs are optional peers; native development packages are pinned to 18.14.0 with an 18.14-to-18.x peer range. Three provider-owned prefixed APIs delegate to rebuilt native protocol models, retaining selected limits and adding Copilot headers only at request time so cached rows remain restorable. Outer dispatch owns codecs and concurrency permits. OMP owns its independent power-copilot login, with device OAuth or masked plain-string API-key login; it neither imports credentials nor fabricates CLI-source expiry. Stored OAuth access uses power-copilot-oauth-v1 followed by JSON token and optional enterpriseUrl because discovery bypasses getApiKey. Requests unwrap only the token; refresh repacks real renewed access and expiry independently of discovery. Malformed envelopes have fixed secret-free errors. The refresh command resolves authentication before live discovery to recover expired grants with cold catalogs. OMP reads the same contextWindows shape in its own agent directory, but its native 24-hour cache retains effective windows, so edits need restart and successful live discovery, and failed or offline refreshes can retain the old snapshot. Pi's raw-cache decision and shared validation bounds remain unchanged.
    zh: 独立 omp 清单和入口共享中立的目录、OAuth、路由及边界代码，不导入 Pi provider 工厂。宿主 SDK 均为可选 peer；原生开发包固定为 18.14.0，peer 范围从 18.14 到 18.x。三个归属 provider 的带前缀 API 委托重建后的原生协议模型，保留选定上限，仅在请求时添加 Copilot 请求头，使缓存行可恢复。外层分发拥有编解码器及并发许可。OMP 拥有独立的 power-copilot 登录，支持设备 OAuth 或掩码普通字符串 API-key 登录；不导入凭据或伪造 CLI 来源到期时间。由于发现绕过 getApiKey，已保存 OAuth access 使用 power-copilot-oauth-v1 前缀及包含 token 和可选 enterpriseUrl 的 JSON。请求仅解包 token；刷新重新封装真实续期 access 与到期时间，独立于发现。无效封装产生固定且不含秘密的错误。刷新命令先解析认证再实时发现，恢复到期 grant 与冷目录的组合。OMP 在自身 agent 目录读取相同 contextWindows 结构，但原生 24 小时缓存保留生效窗口：编辑需要重启及成功实时发现，失败或离线刷新可保留旧快照。Pi 原始缓存决策及共享校验边界保持不变。
  Alternatives considered:
    en: Direct Pi provider or streaming reuse has incompatible contracts. Ordinary protocol rows with headers were exercised and rejected because native cache restoration drops them; provider-wide base URLs also override Enterprise routing. Cross-runtime credential sharing and saved CLI-token substitutes are outside the explicitly owned OAuth and API-key integration.
    zh: 直接复用 Pi provider 或流式处理的契约不兼容。带请求头的普通协议行经验证后不采用，因为原生缓存恢复会丢弃它们；provider 级 base URL 还会覆盖 Enterprise 路由。跨运行时共享凭据及保存 CLI token 作为替代不属于明确归属的 OAuth 和 API-key 集成。
  Consequences:
    en: OMP retains native streaming, credentials, profiles, paths, and cache lifecycle with runtime-specific prefixed APIs and opaque OAuth access. Window edits are not reversible offline, and account changes call for explicit refresh. Neutral tests cover login, routing, notices, renewal, cancellation, reasoning, bounds, and sanitized failures. Bun integration covers the real entry, registry, credential store, three fragmented Unicode SSE protocols and usage, request instrumentation, a one-request limit, expired-grant recovery, Enterprise persistence, and cached windows with live rediscovery. A compiled OMP 18.14.0 CLI smoke run loads source without local SDK dependencies and lists an unauthenticated empty catalog, using the host package root for the agent-directory helper instead of an unavailable compiled subpath. Isolated synthetic tests do not establish real authorization or rendered UI verification; Pi/Harness and minimum-Pi tests continue to pass. Bilingual sections, paragraphs, lists, and links align.
    zh: OMP 保留原生流式处理、凭据、profile、路径及缓存生命周期，并使用运行时专属的带前缀 API 和不透明 OAuth access。窗口编辑不可离线逆转，更换账户需明确刷新。中立测试覆盖登录、路由、通知、续期、取消、reasoning、边界及脱敏失败。Bun 集成覆盖真实入口、registry、凭据存储、三种分块 Unicode SSE 协议和用量、请求检查、单请求上限、到期 grant 恢复、Enterprise 持久化，以及缓存窗口和实时重新发现。编译版 OMP 18.14.0 CLI 冒烟运行在没有本地 SDK 依赖时加载源码并列出未认证空目录，agent 目录辅助函数使用宿主包根入口而非编译版不可用的子路径。隔离合成测试不能证明真实授权或 UI 显示已验证；Pi/Harness 及最低 Pi 版本测试继续通过。双语章节、段落、列表及链接结构一致。
