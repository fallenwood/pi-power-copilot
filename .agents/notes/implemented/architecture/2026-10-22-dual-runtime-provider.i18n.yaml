title:
  en: Share one Power Copilot provider across Pi and Harness
  zh: 在 Pi 与 Harness 间共享同一个 Power Copilot provider
status: implemented
sections:
  Problem:
    en: Pi-specific registration and configuration cannot serve Harness directly. Another streaming implementation would duplicate context, attachment, and replay behavior, while implicit credential sharing obscures ownership.
    zh: Pi 专属注册和配置不能直接服务 Harness。另一个流式实现会重复上下文、附件和 replay 行为，而隐式共享凭据会模糊所有权。
  Decision:
    en: Share the provider factory behind a thin Pi entry and a Harness PiAiAdapter entry. Both model accessors apply overrides. A management Models collection refreshes the dynamic catalog with a five-minute freshness interval, concurrent deduplication, and a thirty-second timeout; captured provider facades and new profile maps preserve prepared calls. Harness keeps only an in-process catalog and persists credentials at power-copilot/power-copilot, without importing Pi credentials or probing Pi token variables. Saved logins take precedence over the apiKeyEnv credential reference, which defaults to POWER_COPILOT_API_KEY. The Models-provider settings decision supersedes only the original command-based authorization UX, not the shared provider, streaming, catalog, or credential-ownership rationale. A small provider-card Client extension supplies page sign-in while retaining the registered authorization flow and credential commits, without secret composer arguments. Cordis contextWindows extends the existing context-window decision without replacing Pi configuration; the settings integration adds live reads and catalog invalidation while prepared calls retain captured metadata. Emit the Harness JavaScript entry and ship localized metadata and an original SVG; the settings extension uses the existing Web application, and runtime-specific peers are optional. Development uses Pi 1.1 and Harness 0.2.1-rc.2, with a root-only pi-codemode 1.1.0 override for coding agent's removed-export incompatibility. Existing header and renewal decisions retain ownership of their rationale.
    zh: 在精简 Pi 入口和 Harness PiAiAdapter 入口后共享 provider 工厂。两个模型读取接口都应用覆盖。管理用 Models 集合以五分钟新鲜度间隔、并发去重和三十秒超时刷新动态目录；捕获目录的 provider 外观对象及新的 profile map 保留已准备调用。Harness 仅保留进程内目录，并在 power-copilot/power-copilot 持久化凭据，不导入 Pi 凭据或探测 Pi token 变量。已保存登录优先于 apiKeyEnv 凭据引用，后者默认使用 POWER_COPILOT_API_KEY。Models provider 设置决策仅取代最初基于命令的授权 UX，不取代共享 provider、streaming、目录或凭据所有权的理由。小型 provider-card Client 扩展提供页面登录，同时保留已注册授权流程及凭据提交，不使用携带秘密的 composer 参数。Cordis contextWindows 扩展已有上下文窗口决策，不替换 Pi 配置；设置集成增加动态读取及目录失效，而已准备调用保留捕获的元数据。生成 Harness JavaScript 入口并分发本地化元数据及原创 SVG；设置扩展使用现有 Web 应用，运行时专属 peer 为可选项。开发使用 Pi 1.1 和 Harness 0.2.1-rc.2，并以仅在根级生效的 pi-codemode 1.1.0 override 修复 coding agent 对已移除 export 的不兼容。已有请求头和续期决策继续拥有各自理由。
  Alternatives considered:
    en: Direct Pi extension loading uses the wrong runtime seams. Generic YAML routes lose dynamic discovery and per-model protocols. Copying streaming duplicates the existing adapter. A second disk catalog or implicit credential migration adds ownership and lifecycle obligations outside the minimal integration.
    zh: 直接加载 Pi 扩展使用了错误的运行时接口。通用 YAML 路由会丢失动态发现和逐模型协议。复制 streaming 会重复现有 adapter。第二份磁盘目录或隐式凭据迁移增加了最小集成以外的所有权和生命周期责任。
  Consequences:
    en: Pi retains its extension workflow and persistent catalog; Harness independently authorizes the same provider semantics using the built-in adapter, with a cold catalog after restart. The public adapter contract and local development pin define the current compatibility boundary without constraining consumers' transitive dependencies. Synthetic fixtures and module loading do not establish real-user OAuth, account access, or rendered metadata verification. The isolated minimum-Pi runner installs exact 0.87.1 packages without install scripts or the development override; all 26 original tests pass with temporary configuration, secret environment filtering, network rejection, preserved exit failures, and real-path-checked cleanup, without changing workspace dependencies.
    zh: Pi 保留扩展工作方式和持久化目录；Harness 独立授权相同 provider 语义并使用内置 adapter，重启后目录为冷缓存。公开 adapter 契约及本地开发版本固定界定当前兼容边界，不限制使用方的传递依赖。合成测试和模块加载不能证明真实用户 OAuth、账户访问或元数据显示已验证。隔离的最低 Pi 版本脚本安装精确 0.87.1 包，禁用安装脚本且不使用开发 override；通过临时配置、秘密环境过滤、网络拒绝、保留失败退出状态及真实路径校验后清理，原有 26 个测试全部通过，不改变工作区依赖。
